name: mr-darcy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-54329}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ['postgres', '-c', 'timezone=UTC']
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 2s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: darcy_test
      POSTGRES_PASSWORD: darcy_test_local
      POSTGRES_DB: mr_darcy_test
    ports:
      - '127.0.0.1:54330:5432'
    tmpfs:
      - /var/lib/postgresql/data
    command: ['postgres', '-c', 'timezone=UTC']
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
